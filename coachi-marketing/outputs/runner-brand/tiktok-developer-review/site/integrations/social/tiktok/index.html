<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok Connection | Everyday Runner Lab</title>
    <meta name="description" content="TikTok OAuth redirect page for Everyday Runner Lab.">
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 22px; font: 18px/1.6 Georgia, "Times New Roman", serif; color: #161616; background: #f7f1e7; }
      h1 { font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
      a { color: #2f6b4f; }
      code { background: #efe4d4; padding: 2px 5px; border-radius: 4px; }
      .button { display: inline-block; margin-top: 18px; padding: 12px 16px; border: 1px solid #2f6b4f; border-radius: 999px; text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
      .muted { color: #5c554c; font-size: 15px; }
    </style>
  </head>
  <body>
    <h1>Everyday Runner Lab TikTok Connection</h1>
    <p id="status">Checking the TikTok authorization result...</p>
    <p id="fallback" class="muted">After authorization, the creator workspace opens the Post to TikTok page where the creator previews content, edits settings, consents, and publishes.</p>
    <p><a id="continue-link" class="button" href="/post-to-tiktok/">Continue to Post to TikTok</a></p>
    <p><a href="/">Back to Everyday Runner Lab</a></p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var state = params.get("state");
        var error = params.get("error") || params.get("error_description");
        var status = document.getElementById("status");
        var link = document.getElementById("continue-link");

        if (error) {
          status.textContent = "TikTok returned an authorization error: " + error;
          link.style.display = "none";
          return;
        }

        if (!code || !state) {
          status.textContent = "This is the registered TikTok redirect URI for Everyday Runner Lab. Start from the creator login or connect page.";
          return;
        }

        status.textContent = "TikTok authorized the request. Continue to the creator-controlled posting flow.";
        link.href = "/post-to-tiktok/";
      })();
    </script>
  </body>
</html>
