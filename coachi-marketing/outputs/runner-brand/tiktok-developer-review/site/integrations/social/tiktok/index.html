<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting to Postiz</title>
    <style>
      :root {
        color: #f7f3ea;
        background: #11130f;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      p {
        color: #bfb8a8;
        line-height: 1.5;
      }

      a {
        color: #f3b15e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirecting to Postiz</h1>
      <p>This page forwards the TikTok authorization result to the local Postiz instance.</p>
      <p>If nothing happens, open <a id="fallback" href="http://localhost:4007/integrations/social/tiktok">local Postiz callback</a>.</p>
    </main>
    <script>
      const localCallback = "http://localhost:4007/integrations/social/tiktok" + window.location.search;
      document.getElementById("fallback").href = localCallback;
      window.location.replace(localCallback);
    </script>
  </body>
</html>
